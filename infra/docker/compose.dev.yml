# Infrastruktur lokal untuk pengembangan.
# Jalankan dari root: pnpm infra:up
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pesona
      POSTGRES_PASSWORD: pesona
      POSTGRES_DB: pesona_dev
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pesona"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]

volumes:
  pgdata:
  redisdata:
